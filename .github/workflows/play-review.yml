name: play-review

# Netcode stress (tools/stress_netcode.py) for gameplay pull requests and
# gameplay pushes to main. Skipped vs 5 vs 20 runs per scenario: see
# tools/play_review_paths.py (FULL_RUNS, LIGHT_RUNS, stress_tier) and
# .cursor/skills/verify-flagoria/ci-netcode-stress.md — do not restate tier
# rules here. pull_request uses read-only contents and no secrets (fork-safe).
# play-review-label.yml does not re-trigger this workflow on label add, so the
# gate step also honours needs-play-review via --labeled.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: play-review-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  stress:
    name: Netcode stress
    if: github.event.action != 'labeled' || github.event.label.name == 'needs-play-review'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Needs play review?
        id: gate
        env:
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'needs-play-review') }}
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 tools/play_review_paths.py --self-test
          mb="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
          git diff --name-only "$mb" "$HEAD_SHA" > "$RUNNER_TEMP/paths.txt"
          git diff -U0 "$mb" "$HEAD_SHA" > "$RUNNER_TEMP/change.diff"
          git show "$mb:project.godot" > "$RUNNER_TEMP/base.godot" || rm -f "$RUNNER_TEMP/base.godot"
          git show "$HEAD_SHA:project.godot" > "$RUNNER_TEMP/head.godot" || rm -f "$RUNNER_TEMP/head.godot"
          labeled=()
          if [ "$LABELED" = "true" ]; then labeled=(--labeled); fi
          python3 tools/play_review_paths.py --files "$RUNNER_TEMP/paths.txt" --diff "$RUNNER_TEMP/change.diff" \
            --event "$EVENT" "${labeled[@]}" \
            --base-project "$RUNNER_TEMP/base.godot" --head-project "$RUNNER_TEMP/head.godot"

      - name: Install Godot 4.7.2
        if: steps.gate.outputs.gameplay == 'true'
        uses: ./.github/actions/install-godot

      - name: Stress multiplayer scenarios (${{ steps.gate.outputs.stress_runs }} runs each, 4 at a time)
        if: steps.gate.outputs.gameplay == 'true'
        env:
          STRESS_RUNS: ${{ steps.gate.outputs.stress_runs }}
        run: python3 tools/stress_netcode.py

      - name: Upload failed run logs (also retried ones)
        if: always() && steps.gate.outputs.gameplay == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: netcode-stress-logs
          path: artifacts/out/stress/
          if-no-files-found: ignore

  job-times:
    name: Job times
    needs: [stress]
    if: ${{ !cancelled() && needs.stress.result != 'skipped' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/job-times.yml

name: android-apk

on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/android-apk.yml
      - tools/next_test_tag.sh
      - tools/check_apk_audio.sh
      - export_presets.cfg

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.7.2
  ANDROID_BUILD_TOOLS: 35.0.1
  ANDROID_PLATFORM: android-35

jobs:
  apk:
    name: Export Android debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          set -euo pipefail
          (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "platform-tools" "build-tools;${ANDROID_BUILD_TOOLS}" "platforms;${ANDROID_PLATFORM}"

      - name: Install Godot and export templates
        run: |
          set -euo pipefail
          base=https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" /usr/local/bin/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dest="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$dest"
          unzip -q -j /tmp/templates.tpz 'templates/android_*' 'templates/version.txt' -d "$dest"
          ls "$dest"

      - name: Set up signing keystore and editor settings
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/signing.keystore"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$keystore"
            alias="$KEY_ALIAS"
            pass="$KEYSTORE_PASSWORD"
          elif [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "::warning::Signing secrets are not available to this run; using a throwaway key. This APK cannot update an installed build."
            alias=androiddebugkey
            pass="$(openssl rand -hex 16)"
            keytool -genkeypair -keystore "$keystore" -storepass "$pass" \
              -alias "$alias" -keypass "$pass" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=throwaway pull request build"
          else
            echo "::error::Missing ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD or ANDROID_KEY_ALIAS secret. Published builds must be signed with the stable key."
            exit 1
          fi
          echo "::add-mask::$pass"
          {
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=$alias"
            echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=$pass"
          } >> "$GITHUB_ENV"
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-${GODOT_VERSION%.*}.tres" <<TRES
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "$ANDROID_HOME"
          export/android/java_sdk_path = "$JAVA_HOME"
          TRES

      - name: Set version code
        run: |
          set -euo pipefail
          # Android only installs an update over an existing app when the
          # version code is higher, so every build gets a new one.
          code=$((GITHUB_RUN_NUMBER + 1))
          sed -i "s|^version/code=.*|version/code=$code|" export_presets.cfg
          grep -n '^version/code=' export_presets.cfg

      - name: Export APK
        run: |
          set -euo pipefail
          mkdir -p Builds/android
          godot --headless --editor --quit-after 200 --path . || true
          godot --headless --path . --export-debug "Android" Builds/android/flagoria-debug.apk
          test -s Builds/android/flagoria-debug.apk
          ls -l Builds/android

      - name: Print APK signing certificate
        run: |
          set -euo pipefail
          apksigner="$ANDROID_HOME/build-tools/${ANDROID_BUILD_TOOLS}/apksigner"
          "$apksigner" verify --print-certs Builds/android/flagoria-debug.apk | tee "$RUNNER_TEMP/certs.txt"
          apk_sha=$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/certs.txt")
          key_sha=$(keytool -list -v -keystore "$GODOT_ANDROID_KEYSTORE_DEBUG_PATH" \
            -storepass "$GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD" -alias "$GODOT_ANDROID_KEYSTORE_DEBUG_USER" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "APK certificate SHA-256: $apk_sha"
          if [ -z "$apk_sha" ] || [ "$apk_sha" != "$key_sha" ]; then
            echo "::error::APK is not signed with the configured keystore."
            exit 1
          fi

      - name: Check APK audio assets
        run: ./tools/check_apk_audio.sh Builds/android/flagoria-debug.apk

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: flagoria-debug-apk
          path: Builds/android/flagoria-debug.apk
          if-no-files-found: error

      - name: Publish pre-release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          tag="$(git tag -l | ./tools/next_test_tag.sh)"
          short="${GITHUB_SHA::7}"
          apk="Builds/android/flagoria-${tag}-${short}.apk"
          cp Builds/android/flagoria-debug.apk "$apk"
          repo_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" --jq '.[0].number // empty' || true)
          {
            echo "Android debug build \`$tag\` of commit [\`$short\`]($repo_url/commit/$GITHUB_SHA)."
            if [ -n "$pr" ]; then
              echo
              echo "Source pull request: #$pr"
            fi
            echo
            echo "Test build signed with the project's stable test key. Install instructions: [docs/android-apk.md]($repo_url/blob/$GITHUB_SHA/docs/android-apk.md)."
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$tag" "$apk" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --notes-file "$RUNNER_TEMP/notes.md"

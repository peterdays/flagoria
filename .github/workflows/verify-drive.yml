name: verify-drive

# Gameplay drives under xvfb (#385). On pull_request, only for gameplay
# changes (tools/play_review_paths.py): run the drives named by changed
# feature files' Drive: lines with launch.sh --display, upload screenshot
# evidence, and fail when a drive prints VERIFY_DONE fail (hard assert).
# No pixel-diff goldens. Also runnable from the Actions tab (workflow_dispatch).
# Fork safety: pull_request (not pull_request_target), read-only token, no
# secrets; skip pull requests from forks.
on:
  workflow_dispatch:
    inputs:
      drives:
        description: "Drive names in drives/, space separated (empty: smoke)"
        required: false
        default: "smoke"
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-drive-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  drive:
    name: Gameplay drives
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Pick drives
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          INPUT_DRIVES: ${{ github.event.inputs.drives }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          skill=.cursor/skills/verify-flagoria
          drives=""
          if [[ "${EVENT}" == "workflow_dispatch" ]]; then
            drives="${INPUT_DRIVES:-smoke}"
            echo "gameplay=true" >> "$GITHUB_OUTPUT"
            echo "reason=workflow_dispatch" >> "$GITHUB_OUTPUT"
          else
            python3 tools/play_review_paths.py --self-test
            mb="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"
            git diff --name-only "$mb" "$HEAD_SHA" > "$RUNNER_TEMP/paths.txt"
            git diff -U0 "$mb" "$HEAD_SHA" > "$RUNNER_TEMP/change.diff"
            git show "$mb:project.godot" > "$RUNNER_TEMP/base.godot" || rm -f "$RUNNER_TEMP/base.godot"
            git show "$HEAD_SHA:project.godot" > "$RUNNER_TEMP/head.godot" || rm -f "$RUNNER_TEMP/head.godot"
            python3 tools/play_review_paths.py --files "$RUNNER_TEMP/paths.txt" \
              --diff "$RUNNER_TEMP/change.diff" --event "$EVENT" \
              --base-project "$RUNNER_TEMP/base.godot" --head-project "$RUNNER_TEMP/head.godot"
            # play_review_paths writes gameplay= to GITHUB_OUTPUT; re-read it.
            gameplay="$(grep -E '^gameplay=' "$GITHUB_OUTPUT" | tail -n1 | cut -d= -f2-)"
            if [[ "${gameplay}" != "true" ]]; then
              echo "reason=not gameplay" >> "$GITHUB_OUTPUT"
              echo "drives=" >> "$GITHUB_OUTPUT"
              echo "No gameplay paths; skipping drives."
              exit 0
            fi
            # Collect Drive: drives/<path>.gd from changed feature files.
            # Skip two_player/* (needs a paired launch; not run alone here).
            while read -r path; do
              case "${path}" in
                .cursor/skills/verify-flagoria/features/*.md) ;;
                *) continue ;;
              esac
              [[ "$(basename "${path}")" == README.md ]] && continue
              [[ -f "${path}" ]] || continue
              value="$(grep -E '^Drive:[[:space:]]+' "${path}" | head -n1 | sed -E 's/^Drive:[[:space:]]+//; s/[[:space:]]+$//')" || true
              case "${value}" in
                drives/two_player/*)
                  echo "skip paired drive ${value} (from ${path})"
                  ;;
                drives/*.gd)
                  # Strip drives/ prefix and .gd for the launch loop name, keep relative path.
                  rel="${value#drives/}"
                  rel="${rel%.gd}"
                  # Only top-level drives/*.gd in the auto path.
                  if [[ "${rel}" == */* ]]; then
                    echo "skip nested drive ${value}"
                    continue
                  fi
                  drives+="${rel} "
                  ;;
              esac
            done < "$RUNNER_TEMP/paths.txt"
            echo "reason=gameplay PR" >> "$GITHUB_OUTPUT"
          fi
          # Dedup
          drives="$(echo ${drives:-} | tr ' ' '\n' | awk 'NF && !seen[$0]++' | tr '\n' ' ')"
          echo "drives=${drives}" >> "$GITHUB_OUTPUT"
          echo "Selected drives: '${drives}'"

      - name: Install xvfb and Godot 4.7.2
        if: steps.pick.outputs.gameplay == 'true' && steps.pick.outputs.drives != ''
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb
          curl -fsSL -o /tmp/godot.zip \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
          unzip -q -o /tmp/godot.zip -d /tmp/godot
          sudo install -m 755 /tmp/godot/Godot_v4.7.2-stable_linux.x86_64 /usr/local/bin/godot
          godot --version
          command -v xvfb-run

      - name: Import the project
        if: steps.pick.outputs.gameplay == 'true' && steps.pick.outputs.drives != ''
        run: timeout 300 godot --headless --path . --import

      - name: Doctor
        if: steps.pick.outputs.gameplay == 'true' && steps.pick.outputs.drives != ''
        run: .cursor/skills/verify-flagoria/bin/doctor.sh

      - name: Run the drives under xvfb
        if: steps.pick.outputs.gameplay == 'true' && steps.pick.outputs.drives != ''
        env:
          DRIVES: ${{ steps.pick.outputs.drives }}
        run: |
          set -uo pipefail
          skill=.cursor/skills/verify-flagoria
          failed=0
          for name in ${DRIVES}; do
            if [[ ! "${name}" =~ ^[a-z0-9_]+$ || ! -f "${skill}/drives/${name}.gd" ]]; then
              echo "::error::no drive drives/${name}.gd"
              failed=1
              continue
            fi
            echo "::group::drive ${name} (--display)"
            out="$(mktemp)"
            args=(--display)
            seed="$(sed -n 's/^## launch: --seed \([0-9]\{1,10\}\)$/\1/p' "${skill}/drives/${name}.gd" | head -n 1)"
            [[ -n "${seed}" ]] && args+=(--seed "${seed}")
            "${skill}/bin/launch.sh" "drives/${name}.gd" "${args[@]}" | tee "${out}"
            code="${PIPESTATUS[0]}"
            run="$(sed -n 's/^launch: run=\([^ ]*\) .*/\1/p' "${out}" | head -n 1)"
            if [[ "${code}" -eq 0 ]] && grep -q '^VERIFY_IDLE' "${out}"; then
              "${skill}/bin/doctor.sh" --instance "${run}" || code=1
            fi
            # Hard assert: VERIFY_DONE fail (or no ok) already makes launch exit 1.
            if grep -q '^VERIFY_DONE fail$' "${out}"; then
              echo "::error::drive ${name} hard assert failed (VERIFY_DONE fail)"
              code=1
            fi
            "${skill}/bin/cleanup.sh" || true
            echo "::endgroup::"
            if [[ "${code}" -ne 0 ]]; then
              echo "::error::drive ${name} failed (run ${run:-none})"
              failed=1
            else
              echo "drive ${name}: ok (run ${run})"
            fi
          done
          exit "${failed}"

      - name: Upload drive screenshots
        if: always() && steps.pick.outputs.gameplay == 'true' && steps.pick.outputs.drives != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: drive-screenshots
          path: .cursor/skills/verify-flagoria/artifacts/out/runs/
          include-hidden-files: true
          if-no-files-found: warn

  job-times:
    name: Job times
    needs: [drive]
    if: ${{ !cancelled() && needs.drive.result != 'skipped' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/job-times.yml

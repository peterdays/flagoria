name: verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  godot:
    name: Load project and parse scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Godot 4.7.2
        uses: ./.github/actions/install-godot

      - name: Verify
        run: ./tools/verify.sh

      - name: Upload audio check recording
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-check
          path: artifacts/out/audio_check*
          if-no-files-found: ignore

  job-times:
    name: Job times
    needs: [godot]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/job-times.yml

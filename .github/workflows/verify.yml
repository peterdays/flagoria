name: verify

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  godot:
    name: Load project and parse scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify verify path
        id: path
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          python3 tools/verify_fast_path.py --self-test
          paths_file="${RUNNER_TEMP}/verify-paths.txt"
          if [[ "${EVENT}" == "pull_request" ]]; then
            mb="$(git merge-base "${{ github.event.pull_request.base.sha }}" "${{ github.event.pull_request.head.sha }}")"
            git diff --name-only "${mb}" "${{ github.event.pull_request.head.sha }}" > "${paths_file}"
          else
            before="${{ github.event.before }}"
            if [[ "${before}" =~ ^0+$ ]]; then
              echo "verify: full path — initial push (no parent commit)"
              echo "fast_path=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
            git diff --name-only "${before}" "${{ github.sha }}" > "${paths_file}"
          fi
          python3 tools/verify_fast_path.py --files "${paths_file}"

      - name: Install Godot 4.7.2
        if: steps.path.outputs.fast_path != 'true'
        uses: ./.github/actions/install-godot

      - name: Verify
        if: steps.path.outputs.fast_path != 'true'
        run: ./tools/verify.sh

      - name: Docs-only fast path
        if: steps.path.outputs.fast_path == 'true'
        run: |
          set -euo pipefail
          python3 tools/required_checks_test.py
          python3 tools/required_checks.py

      - name: Upload audio check recording
        if: always() && steps.path.outputs.fast_path != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: audio-check
          path: artifacts/out/audio_check*
          if-no-files-found: ignore

  job-times:
    name: Job times
    needs: [godot]
    if: ${{ !cancelled() }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/job-times.yml

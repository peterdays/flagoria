# Proposal only. GitHub does not run files outside .github/workflows.
# This is not a merge gate and not usable enforcement.
# A status posted with the GitHub Actions token can be posted again by any
# workflow in this repository that has statuses: write, including a
# pull_request workflow from the same repository. Pinning the context to the
# GitHub Actions app does not select this file.
# Squash settings do not emit a workflow event, so a success status would
# remain after they change. This file posts failure only, including at the
# start of a run so a previous success does not linger while this run works.
# A GitHub web merge cannot keep the requested committer. This file does not
# accept that committer and does not post success.
# Do not change on: to pull_request. That event runs the workflow from the
# pull request. Do not check out or run pull-request files.
name: commit-identity

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  pull-requests: read
  statuses: write

concurrency:
  group: commit-identity-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  clear:
    name: Clear previous status
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Replace any previous success with failure
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure -f context=commit-identity \
            -f description="reevaluation started"

  branch-commits:
    name: Branch commit identity
    needs: [clear]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Fetch exact head from this repository
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE_SHA" "pull/${PR_NUMBER}/head"
          git -c core.hooksPath=/dev/null rev-parse --verify "${HEAD_SHA}^{commit}"

      - name: Check raw author, committer, and trailers
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          FLAGORIA_COMMIT_IDENTITY_EMAIL: ${{ secrets.FLAGORIA_COMMIT_IDENTITY_EMAIL }}
        run: python3 tools/commit_identity.py check --repo . --base "$BASE_SHA" --head "$HEAD_SHA"

  squash-message:
    name: Squash message
    needs: [clear]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      title_mode: ${{ steps.modes.outputs.title }}
      message_mode: ${{ steps.modes.outputs.message }}
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Fetch exact head from this repository
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          git fetch --no-tags origin "$BASE_SHA" "pull/${PR_NUMBER}/head"
          git -c core.hooksPath=/dev/null rev-parse --verify "${HEAD_SHA}^{commit}"

      - name: Read squash settings or fail closed
        id: modes
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -eu
          title=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .squash_merge_commit_title)
          message=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .squash_merge_commit_message)
          if [ -z "$title" ] || [ -z "$message" ]; then
            echo "squash settings unavailable" >&2
            exit 1
          fi
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "message=$message" >> "$GITHUB_OUTPUT"

      - name: Check the squash message that those settings would build
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          TITLE_MODE: ${{ steps.modes.outputs.title }}
          MESSAGE_MODE: ${{ steps.modes.outputs.message }}
        run: |
          python3 tools/commit_identity.py squash --repo . --base "$BASE_SHA" --head "$HEAD_SHA" \
            --title-mode "$TITLE_MODE" --message-mode "$MESSAGE_MODE" \
            --event "$GITHUB_EVENT_PATH"

  plan:
    name: Bind the in-run snapshot
    needs: [clear, branch-commits, squash-message]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted base
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          fetch-depth: 1
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""

      - name: Re-read the pull request and settings
        id: reread
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -eu
          gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" > /tmp/commit-identity-pr.json
          title_mode=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .squash_merge_commit_title)
          message_mode=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .squash_merge_commit_message)
          echo "title_mode=$title_mode" >> "$GITHUB_OUTPUT"
          echo "message_mode=$message_mode" >> "$GITHUB_OUTPUT"

      - name: Compare the snapshot and withhold success
        env:
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
          TITLE_MODE: ${{ needs.squash-message.outputs.title_mode }}
          MESSAGE_MODE: ${{ needs.squash-message.outputs.message_mode }}
          AFTER_TITLE_MODE: ${{ steps.reread.outputs.title_mode }}
          AFTER_MESSAGE_MODE: ${{ steps.reread.outputs.message_mode }}
          CHECKS_OK: ${{ needs.branch-commits.result == 'success' && needs.squash-message.result == 'success' }}
        run: |
          set -eu
          python3 - << 'PY'
          import json, os
          from pathlib import Path
          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text(encoding="utf-8"))
          pr = event["pull_request"]
          before = {
              "head": pr["head"]["sha"],
              "base": pr["base"]["sha"],
              "title": pr.get("title") or "",
              "body": pr.get("body") or "",
              "title_mode": os.environ.get("TITLE_MODE") or "",
              "message_mode": os.environ.get("MESSAGE_MODE") or "",
          }
          current = json.loads(Path("/tmp/commit-identity-pr.json").read_text(encoding="utf-8"))
          after = {
              "head": current["head"]["sha"],
              "base": current["base"]["sha"],
              "title": current.get("title") or "",
              "body": current.get("body") or "",
              "title_mode": os.environ.get("AFTER_TITLE_MODE") or "",
              "message_mode": os.environ.get("AFTER_MESSAGE_MODE") or "",
          }
          Path("/tmp/commit-identity-before.json").write_text(json.dumps(before), encoding="utf-8")
          Path("/tmp/commit-identity-after.json").write_text(json.dumps(after), encoding="utf-8")
          PY
          python3 tools/commit_identity.py plan \
            --before /tmp/commit-identity-before.json \
            --after /tmp/commit-identity-after.json \
            --checks-ok "$CHECKS_OK"

      - name: Post failure only
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -eu
          gh api "repos/${GITHUB_REPOSITORY}/statuses/${HEAD_SHA}" \
            -f state=failure -f context=commit-identity \
            -f description="not a durable gate"
